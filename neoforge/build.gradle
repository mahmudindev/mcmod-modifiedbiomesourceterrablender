plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

dependencies {
    compileOnly(annotationProcessor(
            group: 'com.github.bawnorton.mixinsquared',
            name: 'mixinsquared-common',
            version: rootProject.mixinsquared_version
    ))
    jarJar(implementation(
            group: 'com.github.bawnorton.mixinsquared',
            name: 'mixinsquared-neoforge',
            version: rootProject.mixinsquared_version
    ))

    implementation(
            group: 'com.github.glitchfiend',
            name: 'TerraBlender-neoforge',
            version: rootProject.terrablender_version
    )

    implementation(
            group: '',
            name: 'modifiedbiomesource-neoforge',
            version: rootProject.modifiedbiomesource_version
    )
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }

        data {
            clientData()
            gameDirectory = this.mkdir(this.file("runs/data"))
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}

sourceSets.configureEach {
    [
            it.compileClasspathConfigurationName,
            it.runtimeClasspathConfigurationName,
            it.getTaskName(null, 'jarJar')
    ].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
